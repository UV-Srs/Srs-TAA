services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-taa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taa_secret}
      POSTGRES_DB: ${DB_NAME:-taa_inspection}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_TYPE: postgresql
      DB_USER: ${DB_USER:-taa}
      DB_PASSWORD: ${DB_PASSWORD:-taa_secret}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-taa_inspection}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000}
    volumes:
      - uploads_data:/app/backend/uploads

volumes:
  postgres_data:
  uploads_data:
