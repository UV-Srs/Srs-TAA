# Alembic configuration for the TAA database.
#
# Run every alembic command from THIS folder (the project root):  alembic current
# The database it acts on comes from ALEMBIC_DATABASE_URL if that is set, otherwise from the same
# settings the app uses (backend/.env: DATABASE_URL or DB_*). The target is printed on every run.
# See "Database migrations" in README.md before touching a database that already holds data.

[alembic]
script_location = backend/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
# Not set here on purpose: backend/migrations/env.py builds the URL so no password is stored in git.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
